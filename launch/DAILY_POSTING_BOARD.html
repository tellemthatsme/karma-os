let currentDay = 1;
let progress = {};

function loadProgress() {
  try {
    const saved = localStorage.getItem('tlm_posting_progress');
    if (saved) progress = JSON.parse(saved);
  } catch(e) {}
}

function saveProgress() {
  localStorage.setItem('tlm_posting_progress', JSON.stringify(progress));
}

function getCompletedCount() {
  return Object.values(progress).filter(d => d && d.bothDone).length;
}

function updateProgressBar() {
  const count = getCompletedCount();
  const pct = (count / 16) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = count + ' / 16 days';
}

function renderDayNav() {
  const nav = document.getElementById('dayNav');
  nav.innerHTML = '';
  for (let i = 1; i <= 16; i++) {
    const btn = document.createElement('button');
    btn.className = 'day-btn';
    btn.textContent = i;
    if (i === currentDay) btn.classList.add('active');
    const dayData = progress[i];
    if (dayData && dayData.bothDone) btn.classList.add('done');
    btn.onclick = () => selectDay(i);
    nav.appendChild(btn);
  }
}

function selectDay(day) {
  currentDay = day;
  renderDayNav();
  renderTrackCard();
}

function renderTrackCard() {
  const track = TRACKS[currentDay - 1];
  const dayData = progress[currentDay] || {};
  const container = document.getElementById('trackContent');

  container.innerHTML = `
    <div class="track-card">
      <div class="track-header">
        <div>
          <div class="track-day">DAY ${track.day} of 16</div>
          <h2>${track.title}</h2>
          <div class="track-channel">Upload to: ${track.channel} | File: ${track.file}</div>
        </div>
      </div>
      <div class="track-body">
        <div class="copy-section">
          <div class="copy-label">
            <span>Title</span>
            <button class="copy-btn" onclick="copyText(this, 'title-${currentDay}')">Copy Title</button>
          </div>
          <div class="copy-content" id="title-${currentDay}">tellemthatsme — ${track.title}</div>
        </div>

        <div class="copy-section">
          <div class="copy-label">
            <span>Description</span>
            <button class="copy-btn" onclick="copyText(this, 'desc-${currentDay}')">Copy Description</button>
          </div>
          <div class="copy-content" id="desc-${currentDay}">${escapeHtml(track.desc)}</div>
        </div>

        <div class="copy-section">
          <div class="copy-label">
            <span>Tags</span>
            <button class="copy-btn" onclick="copyText(this, 'tags-${currentDay}')">Copy Tags</button>
          </div>
          <div class="copy-content tags" id="tags-${currentDay}">${escapeHtml(track.tags)}</div>
        </div>

        <div class="copy-section">
          <div class="copy-label">
            <span>Pinned Comment</span>
            <button class="copy-btn" onclick="copyText(this, 'pinned-${currentDay}')">Copy Comment</button>
          </div>
          <div class="copy-content pinned" id="pinned-${currentDay}">${escapeHtml(track.pinned)}</div>
        </div>
      </div>
    </div>

    <div class="checklist">
      <h3>Upload Checklist — Day ${track.day}</h3>
      <div class="check-item ${dayData.mainDone ? 'done' : ''}">
        <input type="checkbox" id="chk-main" ${dayData.mainDone ? 'checked' : ''} onchange="toggleCheck('main')">
        <label for="chk-main">Main channel (@tellemthatsme69) — Upload + Metadata + Publish</label>
      </div>
      <div class="check-item ${dayData.secondDone ? 'done' : ''}">
        <input type="checkbox" id="chk-second" ${dayData.secondDone ? 'checked' : ''} onchange="toggleCheck('second')">
        <label for="chk-second">Second channel — Upload + Metadata + Publish</label>
      </div>
      <div class="check-item ${dayData.commentDone ? 'done' : ''}">
        <input type="checkbox" id="chk-comment" ${dayData.commentDone ? 'checked' : ''} onchange="toggleCheck('comment')">
        <label for="chk-comment">Pin comment on both videos</label>
      </div>
      <button class="mark-done-btn ${dayData.mainDone && dayData.secondDone ? 'ready' : 'not-ready'}"
              onclick="markDayDone()" ${!(dayData.mainDone && dayData.secondDone) ? 'disabled' : ''}>
        ${dayData.bothDone ? 'Day Complete!' : 'Complete Both Channels First'}
      </button>
    </div>
  `;
}

function toggleCheck(type) {
  if (!progress[currentDay]) progress[currentDay] = {};
  const dayData = progress[currentDay];

  if (type === 'main') {
    dayData.mainDone = document.getElementById('chk-main').checked;
  } else if (type === 'second') {
    dayData.secondDone = document.getElementById('chk-second').checked;
  } else if (type === 'comment') {
    dayData.commentDone = document.getElementById('chk-comment').checked;
  }

  saveProgress();
  renderTrackCard();
}

function markDayDone() {
  if (!progress[currentDay]) progress[currentDay] = {};
  progress[currentDay].bothDone = true;
  saveProgress();
  updateProgressBar();
  renderDayNav();
  renderTrackCard();
  showToast('Day ' + currentDay + ' marked complete!');

  if (currentDay < 16) {
    setTimeout(() => selectDay(currentDay + 1), 1500);
  }
}

function copyText(btn, id) {
  const el = document.getElementById(id);
  const text = el.textContent || el.innerText;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    showToast('Copied to clipboard!');
    setTimeout(() => {
      btn.textContent = btn.textContent.replace('Copied!', '').trim() || 'Copy';
      btn.classList.remove('copied');
    }, 2000);
  });
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function resetProgress() {
  if (confirm('Reset all progress? This cannot be undone.')) {
    progress = {};
    saveProgress();
    updateProgressBar();
    renderDayNav();
    renderTrackCard();
    showToast('Progress reset');
  }
}

// Init
loadProgress();
updateProgressBar();
renderDayNav();
renderTrackCard();
</script>
