name: KARMA OS CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    # Runs the same node-side tests as `npm run test:node` and the e2e tests as `npm run test:e2e`.
    # For the consolidated CI gate, use `npm run test:all` (= test:node && test:e2e).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test karma-abtest.node-test.js
      - run: node --test server.test.js

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test karma-integration.node-test.js

  playwright-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Start server
        run: node server.js &
      - name: Wait for server
        run: for i in $(seq 1 20); do curl -s http://localhost:8888/health && break; sleep 1; echo "Waiting... $i"; done
      - name: Run Playwright tests
        run: npm run test:all
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/

  validation:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start server
        run: node server.js &
      - name: Wait for server
        run: for i in $(seq 1 20); do curl -s http://localhost:8888/health && break; sleep 1; echo "Waiting... $i"; done
      - name: Run validation
        run: node validate-karma.js
